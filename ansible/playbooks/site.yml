---
# =============================================================================
# site.yml – main entry-point playbook
# =============================================================================
# Usage:
#   ansible-playbook -i ansible/inventories/prod/hosts.ini ansible/playbooks/site.yml
#
# Pre-requisites on the control machine:
#   - ansible >= 2.14
#   - Python 3.x with the kubernetes pip package (for the k8s module)
#   - SSH access to all nodes (key-based, agent forwarded or via
#     ansible_ssh_private_key_file in the inventory)
# =============================================================================

- name: Provision k3s cluster
  hosts: k3s_cluster
  become: true
  gather_facts: true
  roles:
    - role: k3s_cluster

- name: Install Argo CD
  hosts: master
  become: true
  gather_facts: false
  roles:
    - role: argocd

- name: Bootstrap App of Apps
  hosts: master
  become: true
  gather_facts: false
  roles:
    - role: argocd_app
