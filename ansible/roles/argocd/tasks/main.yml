---
# =============================================================================
# argocd / tasks / main.yml  –  install Argo CD on the master node
# =============================================================================

- name: Ensure argocd namespace exists (idempotent)
  ansible.builtin.shell: |
    kubectl create namespace {{ argocd_namespace }} \
      --dry-run=client -o yaml | kubectl apply -f -
  register: argocd_ns_apply
  changed_when: "'created' in argocd_ns_apply.stdout"

- name: Apply Argo CD upstream install manifest
  ansible.builtin.command:
    cmd: kubectl apply -n {{ argocd_namespace }} -f {{ argocd_install_manifest }}
  register: argocd_apply
  changed_when: "'configured' in argocd_apply.stdout or 'created' in argocd_apply.stdout"

- name: Patch argocd-server service to NodePort
  ansible.builtin.shell: |
    kubectl patch svc argocd-server -n {{ argocd_namespace }} \
      -p '{"spec":{"type":"NodePort","ports":[
            {"name":"http","port":80,"targetPort":8080,"nodePort":{{ argocd_server_nodeport }}},
            {"name":"https","port":443,"targetPort":8080,"nodePort":{{ argocd_server_nodeport_https }}}
          ]}}'
  when: argocd_server_nodeport != ""
  changed_when: true

- name: Wait for Argo CD server deployment to be ready
  ansible.builtin.command:
    cmd: >
      kubectl rollout status deployment/argocd-server
      -n {{ argocd_namespace }} --timeout=300s
  changed_when: false
  register: argocd_rollout
  until: argocd_rollout.rc == 0
  retries: 5
  delay: 30
