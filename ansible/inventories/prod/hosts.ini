# =============================================================================
# Ansible Inventory – Production
# =============================================================================
# Replace the example IP addresses / hostnames below with your actual values.
# You can use either IP addresses (e.g. 192.168.1.10) or DNS hostnames.
#
# SSH access:
#   ansible_user      – the remote user (must have sudo or be root)
#   ansible_ssh_private_key_file – path to your private key on the Ansible
#                                  control machine (leave empty and set in
#                                  group_vars/all.yml or via --private-key)
# =============================================================================

[master]
k3s-master  ansible_host=192.168.1.10  ansible_user=ubuntu

[workers]
k3s-worker1 ansible_host=192.168.1.11  ansible_user=ubuntu
k3s-worker2 ansible_host=192.168.1.12  ansible_user=ubuntu

# Group combining all k3s nodes
[k3s_cluster:children]
master
workers

# Common variables for all hosts (can be overridden per host above)
[k3s_cluster:vars]
ansible_ssh_private_key_file=~/.ssh/id_rsa
# Uncomment if your remote user needs to use sudo without a password prompt:
# ansible_become=true
# ansible_become_method=sudo
