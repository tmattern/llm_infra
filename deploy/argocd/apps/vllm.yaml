---
# =============================================================================
# Argo CD Application – vLLM (OpenAI-compatible LLM inference server)
# Deployed from the official Helm chart in the vLLM repository.
# See: https://github.com/vllm-project/vllm
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vllm
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://vllm-project.github.io/vllm
      chart: vllm
      targetRevision: "0.6.3"
      helm:
        valueFiles:
          - $values/deploy/helm-values/vllm/values.yaml
    - repoURL: https://github.com/tmattern/llm_infra.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: vllm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
