---
# =============================================================================
# Argo CD Application – Headlamp (Kubernetes Web UI)
# Helm chart: https://headlamp-k8s.github.io/headlamp
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://headlamp-k8s.github.io/headlamp
      chart: headlamp
      targetRevision: "0.25.1"
      helm:
        valueFiles:
          - $values/deploy/helm-values/headlamp/values.yaml
    - repoURL: https://github.com/tmattern/llm_infra.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: headlamp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
