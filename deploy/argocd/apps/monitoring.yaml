---
# =============================================================================
# Argo CD Application – Monitoring (kube-prometheus-stack)
# Helm chart: https://prometheus-community.github.io/helm-charts
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: "58.3.3"
      helm:
        valueFiles:
          - $values/deploy/helm-values/monitoring/values.yaml
    - repoURL: https://github.com/tmattern/llm_infra.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
